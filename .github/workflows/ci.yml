# Runs the checks on every push and pull request (after the repo is on GitHub).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: industrialink
          POSTGRES_PASSWORD: industrialink
          POSTGRES_DB: industrialink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U industrialink"
          --health-interval 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://industrialink:industrialink@localhost:5432/industrialink_test
      TEST_DATABASE_URL: postgresql://industrialink:industrialink@localhost:5432/industrialink_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      DEV_LOGIN: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
